name: Compilar WriteFlow para Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Por defecto, solo lectura. El permiso de escritura se concede únicamente al
# trabajo que crea la release.
permissions:
  contents: read

jobs:
  comprobaciones:
    name: Comprobaciones (TypeScript + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias del sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - name: Comprobar tipos y compilar el frontend
        run: npm run build
      - name: Pruebas del esquema local y los repositorios
        run: npm test

      - name: Comprobar el backend en Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Pruebas del cifrado
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Instalador de Windows (.msi y .exe)
    runs-on: windows-latest
    needs: comprobaciones
    # Solo al publicar una etiqueta o al lanzarlo a mano: compilar Windows tarda
    # diez minutos y no hace falta en cada push a main.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # tauri-action crea la release y sube los instaladores: necesita escritura.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Compilar la aplicación
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('WriteFlow {0}', github.ref_name) || '' }}
          releaseBody: 'Descarga el instalador `.exe` (recomendado) o el `.msi`.'
          releaseDraft: true
          prerelease: false

      - name: Publicar los instaladores como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: writeflow-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
