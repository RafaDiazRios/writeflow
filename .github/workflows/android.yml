name: Compilar WriteFlow para Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: 27.3.13750724

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-latest
    permissions:
      contents: write # para adjuntar el APK a la release
    env:
      # `secrets` no se puede consultar en el `if` de un paso, pero `env` sí.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar el NDK
        run: sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;34.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1  
      # Gradle se cachea entre ejecuciones, así que a partir de la segunda vez ni
      # siquiera hay que descargarlo.
      - uses: gradle/actions/setup-gradle@v4

      # services.gradle.org corta la descarga de vez en cuando y tumba la
      # compilación entera. Se baja aquí, con reintentos, antes de empezar:
      # así un corte pasajero cuesta quince segundos y no una ejecución.
      - name: Descargar Gradle con reintentos
        working-directory: src-tauri/gen/android
        run: |
          for i in 1 2 3 4; do
            if ./gradlew --version; then echo "Gradle listo"; exit 0; fi
            echo "::warning::Falló la descarga de Gradle (intento $i). Reintentando…"
            sleep $((i * 15))
          done
          echo "::error::No se pudo descargar Gradle tras cuatro intentos"
          exit 1

      # El keystore no está en el repositorio. Si los secretos existen, la release
      # sale firmada; si no, sale sin firmar y sirve igual para probar.
      - name: Preparar la firma
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/writeflow.keystore"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/writeflow.keystore
          EOF

      - name: Compilar el APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "NDK en $NDK_HOME"
          npm run android:build

      - name: Renombrar con la versión
        id: apk
        run: |
          SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release*.apk" | head -1)
          if [ -z "$SRC" ]; then echo "::error::No se generó ningún APK"; exit 1; fi
          case "$SRC" in
            *unsigned*) echo "::warning::El APK ha salido SIN FIRMAR: faltan los secretos del keystore, así que no se podrá instalar." ;;
          esac
          NAME="WriteFlow-${GITHUB_REF_NAME:-dev}.apk"
          cp "$SRC" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: writeflow-android
          path: ${{ steps.apk.outputs.path }}

      # La release la crea el flujo de Windows, que tarda bastante más que este.
      # Antes se intentaba subir el APK una sola vez y, si la release todavía no
      # existía, el paso fallaba en silencio (`continue-on-error`) y el flujo
      # terminaba en verde sin APK adjunto. Ahora se espera a que aparezca.
      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="${{ steps.apk.outputs.path }}"
          # Hasta 25 minutos: lo que puede tardar la compilación de Windows.
          for i in $(seq 1 50); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
              echo "APK adjuntado a la release $GITHUB_REF_NAME"
              echo "✅ APK adjuntado a la release **$GITHUB_REF_NAME**" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "La release $GITHUB_REF_NAME aún no existe (intento $i). Esperando…"
            sleep 30
          done
          # Que no exista tras 25 minutos no invalida el APK: está en Artifacts.
          # Pero tiene que verse, no quedarse en un paso verde que engaña.
          echo "::warning::La release $GITHUB_REF_NAME no apareció en 25 minutos. El APK está en los artefactos de esta ejecución; adjúntalo a mano."
          {
            echo "### ⚠️ APK sin adjuntar"
            echo ""
            echo "La release \`$GITHUB_REF_NAME\` no existía al terminar la compilación."
            echo "El APK está en **Artifacts → writeflow-android**, en esta misma página."
          } >> "$GITHUB_STEP_SUMMARY"
