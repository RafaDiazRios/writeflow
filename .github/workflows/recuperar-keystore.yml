# Recuperar el keystore de Android desde los secretos del repositorio.
#
# POR QUE EXISTE: el fichero .jks con el que se firma la aplicacion de Android no
# esta ni en el disco ni en Google Drive. La unica copia viva es el secreto
# ANDROID_KEYSTORE_BASE64, y los secretos no se pueden leer desde la web. Este
# flujo lo decodifica y lo sube como artefacto para poder descargarlo una vez.
#
# NO ES UN FLUJO PERMANENTE. Se ejecuta una vez, se descarga el artefacto, y
# despues SE BORRAN el artefacto y este fichero. Mientras el artefacto exista,
# la clave de firma esta descargable por cualquiera con acceso al repositorio.
#
# Se dispara solo a mano y exige escribir RECUPERAR: no se ejecuta por un push,
# ni por una etiqueta, ni por un clic distraido.

name: Recuperar el keystore

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe RECUPERAR. El artefacto incluira la clave de firma y su contrasena.'
        required: true
        default: ''

# Este flujo no necesita tocar el repositorio.
permissions: {}

jobs:
  recuperar:
    # Solo el dueno del repositorio, aunque algun dia haya colaboradores.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar la confirmacion
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          if [ "$CONFIRMAR" != "RECUPERAR" ]; then
            echo "::error::Hay que escribir exactamente RECUPERAR para ejecutar esto."
            exit 1
          fi

      - name: Decodificar el keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::El secreto ANDROID_KEYSTORE_BASE64 esta vacio o no existe. No hay nada que recuperar."
            exit 1
          fi
          mkdir -p recuperado
          printf '%s' "$KEYSTORE_B64" | base64 --decode > recuperado/writeflow.jks

          # Un keystore JKS empieza por FE ED FE ED; uno PKCS12, por 30 82. Si el
          # secreto estuviera mal pegado, aqui se ve antes de dar nada por bueno.
          firma=$(od -An -tx1 -N4 recuperado/writeflow.jks | tr -d " \n")
          echo "Primeros bytes: $firma"
          case "$firma" in
            feedfeed*|3082*) echo "Tiene pinta de keystore." ;;
            *) echo "::error::Esto no parece un keystore. Revisa el secreto."; exit 1 ;;
          esac
          echo "Tamano: $(stat -c%s recuperado/writeflow.jks) bytes"

      - name: Comprobar que la contrasena y el alias guardados abren el keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # keytool imprime el alias y las huellas, que son publicas; la
          # contrasena no aparece en la salida, y ademas Actions la enmascara.
          keytool -list -v \
            -keystore recuperado/writeflow.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -E 'Alias|SHA-256|Valid|Propietario|Owner' || true

      - name: Dejar escrito lo que no esta en ningun disco
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # El .jks solo sirve con su contrasena, y esa contrasena no esta
          # apuntada en ningun sitio fuera de este secreto. Va en el artefacto
          # para poder guardarlo todo junto en el gestor de contrasenas.
          cat > recuperado/LEEME.txt <<EOF
          Keystore de firma de WriteFlow para Android.

          Fichero    : writeflow.jks
          Alias      : $KEY_ALIAS
          Contrasena : $KEYSTORE_PASSWORD

          Guardalo en el gestor de contrasenas. Con estas tres cosas se puede
          seguir publicando actualizaciones que se instalen encima de la app ya
          instalada. Sin ellas, solo queda desinstalar y empezar de cero.

          Y ahora, sin dejarlo para luego:
            1. Borra el artefacto de esta ejecucion en la pestana Actions.
            2. Borra el fichero .github/workflows/recuperar-keystore.yml.
          EOF
          echo "Escrito recuperado/LEEME.txt"

      - name: Subir el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: keystore-writeflow
          path: recuperado/
          retention-days: 1

      - name: Que hacer ahora
        run: |
          echo "::warning::Descarga el artefacto 'keystore-writeflow', guardalo en el gestor de contrasenas, y despues BORRA el artefacto y este flujo."
